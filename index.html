<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>HoverMagic – Spielerische Interaktion mit CSS</title>
  </head>
  <body>
    <!-- Drei Boxen mit unterschiedlichen Startwinkeln (CSS-Variable --a) -->
    <div class="box" style="--a: 0deg"></div>
    <div class="box" style="--a: 90deg"></div>
    <div class="box" style="--a: 180deg"></div>

    <script src="script.js" defer></script>
  </body>
</html>
